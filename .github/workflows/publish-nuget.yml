name: Publish NuGet Packages to GitHub Packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (např. beta1, preview2). Ponechej prázdné pro release.'
        required: false
        default: ''

env:
  # GitHub Packages NuGet source
  NUGET_SOURCE: 'https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      smtp4dev:
        image: rnwood/smtp4dev:latest
        ports:
          - 2525:25
          - 5000:80
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify NuGet package manifest
        run: bash eng/verify-nuget-package-manifest.sh

      # Načteme základní verzi z csproj a nastavíme finální verzi
      - name: Set version
        id: version
        run: |
          BASE_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Tempo.Blazor/Tempo.Blazor.csproj)
          echo "Base version from csproj: $BASE_VERSION"

          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            # Z tagu v1.2.3 uděláme verzi 1.2.3
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Using version from tag: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ github.event.inputs.version_suffix }}" ]; then
            # Ruční spuštění bez suffixu = release verze z csproj
            echo "VERSION=$BASE_VERSION" >> $GITHUB_OUTPUT
            echo "Using release version from csproj: $BASE_VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_suffix }}" ]; then
            # Suffix pro prerelease verze (např. 1.0.0-beta1)
            echo "VERSION=$BASE_VERSION-${{ github.event.inputs.version_suffix }}" >> $GITHUB_OUTPUT
            echo "Using version with suffix: $BASE_VERSION-${{ github.event.inputs.version_suffix }}"
          else
            # Pro main/master push použijeme timestamp jako prerelease
            TIMESTAMP=$(date +'%Y%m%d%H%M%S')
            echo "VERSION=$BASE_VERSION-ci-$TIMESTAMP" >> $GITHUB_OUTPUT
            echo "Using CI version: $BASE_VERSION-ci-$TIMESTAMP"
          fi

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

      # Named exceptions of the release gate (DEC-TEMPO-RELEASE-GATE, Fáze 12):
      #   Tempo.Blazor.E2E — Playwright over the demo hosts; measured separately, not a gate
      #     until the run finishes green with a recorded duration.
      #   Tempo.ReportServer.Api.Tests.MsSql — needs localhost\SQLEXPRESS or
      #     REPORTSERVER_TEST_CONNECTION (see MsSqlTestDatabase.cs). Decision: do not fix;
      #     owner ptyll. Pattern is anchored on the namespace, not a bare substring.
      # Smtp4Dev is NOT an exception: the two Demo.Api tests are in the gate and CI starts
      # smtp4dev as a job service (ports 2525/5000). Keep this filter identical to
      # publish-nuget-org.yml AND to the second lane below — ReleaseGateFilterTests enforces every
      # occurrence in both files, not just the first one.
      #
      # WHAT THIS GATE DOES NOT COVER — THE TAG GUARD, written here because a green gate is otherwise
      # read as covering everything the suite contains.
      # `ReleaseContractTests.AnnouncedVersion_IsEitherUntagged_OrItsTagNamesTheCommitBeingPacked`
      # compares the announced version against the tag of that name. IT CANNOT GO RED ON ANY CI LANE
      # OF THIS WORKFLOW, for two independent reasons, and removing one leaves the other:
      #   * on a branch push, `actions/checkout@v4` fetches no tags, so the lookup finds nothing —
      #     and "no such tag" is that guard's PASSING value. It is VACUOUS. Measured 2026-08-21 by
      #     running the guard itself over a `git clone --depth 1 --no-tags` of this repository with
      #     the changelog announcing an already-tagged number: RED in a full clone
      #     (`tag-commit=714093ce…`, `visible-tags=77`), GREEN in the CI-shaped one
      #     (`tag-commit=(no such tag)`, `visible-tags=0`). Same binary, same HEAD, same changelog;
      #     the ref store was the only variable.
      #   * on a tag push, the version being published is taken FROM the tag (see "Set version"), and
      #     the step below refuses a tag that disagrees with the changelog — so the guard's subject
      #     `v<announced>` IS the pushed tag, which names this very HEAD. It is TAUTOLOGICAL. Measured
      #     in the same clone with `v2.8.20` created at HEAD and all 78 tags visible: GREEN, with
      #     `tag-commit == head`.
      # `fetch-tags: true` is therefore NOT the treatment: it would remove the first reason and leave
      # the second, changing how informed this step looks without changing what it can detect.
      # ITS PLACE IS THE LOCAL RUN BEFORE A RELEASE — `dotnet test` on a machine holding a full clone,
      # where the ref store carries every v2.8.* tag and the comparison has both sides.
      # AND THE OVERLAPPING FEED GUARD IS WEAKER HERE THAN IN publish-nuget-org.yml, so it is not a
      # substitute: `AnnouncedVersion_IsNotAlreadyPublishedOnTheFeed` and the refusal in
      # eng/pack-nuget-packages.sh both ask NUGET.ORG, which is not the feed this workflow pushes to.
      # For GitHub Packages the only per-number evidence is the push step's own accounting below.
      #
      # WHICH IS ALSO WHERE A RE-RUN OF THIS WORKFLOW DIES, and the answer is NOT the same as in
      # publish-nuget-org.yml — the ordering has to be read per feed. Releases here go out on the same
      # tag as the nuget.org ones, so once that number is visible on nuget.org this step goes red
      # (the `publish` job carries `needs: build-and-test`) and the publish job never starts; the
      # refusal in eng/pack-nuget-packages.sh at the `Build packages` step is next, still ahead of the
      # `Push packages to GitHub Packages` step. But BOTH of those guards ask nuget.org, which is not the feed this workflow
      # pushes to: for a number spent only on GitHub Packages they are silent by construction, and the
      # push step's accounting below really is the first and only refusal. Either way the bound is the
      # same and is said here so the re-runner meets it: a re-run over a spent number is EXPECTEDLY RED
      # and is NOT evidence that the release failed — THE TREATMENT IS A BUMP, NOT A RE-RUN, because
      # the number is spent and the artefacts under it are immutable.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~Tempo.Blazor.E2E&FullyQualifiedName!~Tempo.ReportServer.Api.Tests.MsSql"

      # A SECOND LANE OVER THE SAME BINARIES, DIFFERING IN EXACTLY ONE VARIABLE: the ambient culture.
      #
      # THE CLASS OF DEFECT IT EXISTS FOR, measured rather than imagined: a test whose subject is a
      # PAGE spells English chrome ("Copied", "Active", "Folder permissions") only because it had to
      # spell something. Under an English or invariant culture such a test is green while measuring
      # nothing about language; under a Czech one it reads the Czech translation and turns red. Ten
      # of them were found that way on 2026-08-21 (commit a51e833d) — on a developer machine, because
      # no workflow set a locale and .NET then resolves the neutral, English table.
      #
      # MEASURED 2026-08-21 over ONE build of tests/Tempo.ReportServer.Web.Tests, with one pinned test
      # unpinned as the mutation:
      #     LC_ALL=cs_CZ.UTF-8   -> 1 failed / 97 passed  (the mutated test, on its own assertion)
      #     LC_ALL=C.UTF-8       -> 98 passed             (what this runner did before this lane)
      #     no LANG/LC_ALL at all-> 98 passed             (a bare runner's shape)
      # The binaries were identical in all three, so those greens are the blindness itself.
      # The whole gate is green under this lane. THE COUNTS ARE DELIBERATELY NOT WRITTEN HERE: the
      # first version of this comment carried them, and they had already rotted by the end of the
      # round that wrote it — the same round added four guards, so the number it quoted described the
      # previous tree. The lane prints its own totals on every run, which is the only place they can
      # stay true. Cost, measured 2026-08-21 on a developer machine: about a minute of extra test
      # time and no extra build, because this lane reuses the first one's --no-build output.
      #
      # THE LOCALE IS SET ON THIS STEP AND NOWHERE ELSE, and the placement is load-bearing: exporting
      # a locale before `dotnet build` changes the order in which globbed sources are enumerated and
      # therefore the emitted IL. This lane must differ from the first in what the tests READ, never
      # in what was compiled — it reuses the same --no-build output, so it cannot.
      #
      # cs_CZ DOES NOT HAVE TO EXIST IN THE RUNNER'S glibc. Measured on a box whose `locale -a` lists
      # four entries and no fr_FR: LC_ALL=fr_FR.UTF-8 still flipped the culture and turned the mutated
      # test red. .NET reads the variable and resolves through ICU, so this lane is not silently
      # vacuous on a stock image. The echo prints both variables on every run, so a lane that lost
      # them says so instead of passing quietly.
      #
      # WHAT IT DOES NOT COVER: a defect that needs a THIRD culture — Turkish dotted-I casing, say —
      # is invisible to both lanes. This closes "assumes the machine speaks English", not
      # "is culture-sensitive at all".
      - name: Test (non-English ambient culture)
        env:
          LANG: cs_CZ.UTF-8
          LC_ALL: cs_CZ.UTF-8
        run: |
          echo "[locale-lane] LANG=$LANG LC_ALL=$LC_ALL"
          dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~Tempo.Blazor.E2E&FullyQualifiedName!~Tempo.ReportServer.Api.Tests.MsSql"

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Publikujeme jen na verzovaném tagu (release, refs/tags/v*) nebo při ručním spuštění -
    # NE na každý push do main/master (ten jen builduje a testuje). Verzi řídí tag / csproj.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify NuGet package manifest
        run: bash eng/verify-nuget-package-manifest.sh

      # Načteme základní verzi z csproj a nastavíme finální verzi
      - name: Set version
        id: version
        run: |
          BASE_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Tempo.Blazor/Tempo.Blazor.csproj)
          echo "Base version from csproj: $BASE_VERSION"

          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            # Z tagu v1.2.3 uděláme verzi 1.2.3
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Using version from tag: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ github.event.inputs.version_suffix }}" ]; then
            # Ruční spuštění bez suffixu = release verze z csproj
            echo "VERSION=$BASE_VERSION" >> $GITHUB_OUTPUT
            echo "Using release version from csproj: $BASE_VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_suffix }}" ]; then
            # Suffix pro prerelease verze (např. 1.0.0-beta1)
            echo "VERSION=$BASE_VERSION-${{ github.event.inputs.version_suffix }}" >> $GITHUB_OUTPUT
            echo "Using version with suffix: $BASE_VERSION-${{ github.event.inputs.version_suffix }}"
          fi
          # Tato publish úloha běží jen na tagu refs/tags/v* (release) nebo workflow_dispatch
          # (viz job `if:`), takže větev s CI timestampem (main/master push) z build-and-test zde
          # není dosažitelná a záměrně chybí.

      # THE NUMBER BEING PUBLISHED IS COMPARED WITH THE NUMBER BEING ANNOUNCED, and nothing did that
      # before this step existed. On a tag push VERSION comes from the TAG (above), while the two feed
      # guards ask about whichever number they were handed — one about the changelog's, one about
      # $VERSION. The pair csproj ↔ CHANGELOG is clamped by ReleaseContractTests; the pair
      # TAG ↔ CHANGELOG was clamped by nobody, only by a procedure ("tag after the bump"), and a
      # procedure is not a gate. Placed BEFORE Build and Build packages so a disagreeing release is
      # refused before any work, and before any push can be attempted.
      - name: Verify the version being published is the one the changelog announces
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: bash eng/verify-announced-version.sh

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Build packages
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: bash eng/pack-nuget-packages.sh

      - name: List packages
        run: ls -la ./packages

      # THE PUSH CLASSIFIER IS BOUND TO SDK WORDING (10.0.111: "Your package was pushed." /
      # "Created http" vs "already exists at feed" / "Conflict http"). A future SDK that rewords
      # those sentences would classify every package UNRESOLVED and fail the release loudly.
      # This probe re-measures the wording against a local 201/409 endpoint over the packages
      # just packed, before anything is sent to the real feed. See eng/verify-push-classifier.sh.
      - name: Probe the push classifier against a local 201/409 endpoint
        run: bash eng/verify-push-classifier.sh

      # Přidáme GitHub Packages jako NuGet source s PAT tokenem
      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source "${{ env.NUGET_SOURCE }}" \
            --name "github" \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      # EVERY PACKAGE GETS ITS OWN VERDICT, and the job is green only when all of them were published.
      # `--skip-duplicate` (which the script keeps, and keeps for a reason — see its header) answers a
      # 409 with EXIT 0, so this loop used to report the same green whether 26 packages went out or
      # none did. The script pushes all 26 regardless of what happens to any one of them — dropping
      # the flag would abort the rest and ship half a release — then classifies each as PUBLISHED,
      # SKIPPED, FAILED or UNRESOLVED and fails the job on anything that is not PUBLISHED.
      # This is also the ONLY per-number evidence this workflow has: the feed guards in the suite ask
      # nuget.org, not GitHub Packages.
      #
      # AND THERE IS NO GREEN SECOND RUN OF THIS STEP ONCE IT HAS PUSHED. That is the intended
      # semantics of the accounting above, and it is written down here so the next reader does not go
      # hunting for a defect that is not there. The verdict is `published == total`, and a package the
      # feed already serves under this number classifies as SKIPPED rather than PUBLISHED — so a second
      # run over a number that already went out reports every staged package SKIPPED and fails, and it
      # will keep failing that way for as long as that number exists. Re-running this job because the
      # artefact upload died, or because somebody clicked "Re-run jobs", is therefore EXPECTEDLY RED
      # and is NOT evidence that the release failed. THE TREATMENT IS A BUMP, NOT A RE-RUN: the number
      # is spent, the artefacts under it are immutable, and the way forward is the next number on a new
      # run. No re-run of this one can come back green.
      - name: Push packages to GitHub Packages
        env:
          PUSH_SOURCE: "github"
          PUSH_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: bash eng/push-nuget-packages.sh

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg
