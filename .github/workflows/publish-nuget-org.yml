name: Publish NuGet Packages to NuGet.org

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (např. beta1, preview2). Ponechej prázdné pro release.'
        required: false
        default: ''

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The release gate's bUnit wait budget. TestAssemblyInit defaults it to 2 s — a number
    # measured on a developer machine under parallel load — and shared ubuntu-latest runners
    # (2–4 vCPU) red the gate on WaitFor*/state timeouts that are nobody's assertion. 10 s is
    # the budget this ran with before the tightening. Job-level, not per-step: the two test
    # lanes differ in exactly the ambient culture, and two step-level values could drift
    # apart — ReleaseGateFilterTests requires this on every job that runs `dotnet test`.
    env:
      TEMPO_BUNIT_WAIT_SECONDS: "10"
      # N208: inside CI a shallow checkout must FAIL the suite, not skip every git-facing guard
      # green. FullCloneFactAttribute throws instead of answering a skip reason when this is set.
      TEMPO_REQUIRE_FULL_CLONE: "1"
    services:
      smtp4dev:
        image: rnwood/smtp4dev:latest
        ports:
          - 2525:25
          - 5000:80
    steps:
      # fetch-depth: 0 — the release gate below contains two guards that ask git about objects
      # beyond HEAD: ChangelogReferencesExistingCommitsTests runs `git cat-file -e <id>^{commit}`
      # over every commit id the changelog cites, which reads exit 128 on all of them at the
      # default depth 1 (measured red build-and-test — this line is what ends it), and the tag
      # guard described under the Test step compares `v<announced>` against a tag store a
      # depth-1 fetch does not carry. The publish job's checkout carries the same depth so both
      # jobs see the same ref store.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify NuGet package manifest
        run: bash eng/verify-nuget-package-manifest.sh

      # Načteme základní verzi z csproj a nastavíme finální verzi
      - name: Set version
        id: version
        run: |
          # Načteme verzi z Tempo.Blazor.csproj
          BASE_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Tempo.Blazor/Tempo.Blazor.csproj)
          echo "Base version from csproj: $BASE_VERSION"
          
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            # Z tagu v1.2.3 uděláme verzi 1.2.3
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Using version from tag: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ github.event.inputs.version_suffix }}" ]; then
            # Ruční spuštění bez suffixu = použijeme verzi z csproj
            echo "VERSION=$BASE_VERSION" >> $GITHUB_OUTPUT
            echo "Using release version from csproj: $BASE_VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_suffix }}" ]; then
            # Suffix pro prerelease verze (např. 1.0.0-beta1)
            echo "VERSION=$BASE_VERSION-${{ github.event.inputs.version_suffix }}" >> $GITHUB_OUTPUT
            echo "Using version with suffix: $BASE_VERSION-${{ github.event.inputs.version_suffix }}"
          else
            # Pro main/master push použijeme timestamp jako prerelease
            TIMESTAMP=$(date +'%Y%m%d%H%M%S')
            echo "VERSION=$BASE_VERSION-ci-$TIMESTAMP" >> $GITHUB_OUTPUT
            echo "Using CI version: $BASE_VERSION-ci-$TIMESTAMP"
          fi

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

      # Named exceptions of the release gate (DEC-TEMPO-RELEASE-GATE):
      #   Tempo.Blazor.E2E — Playwright over the demo hosts; excluded from this lane because
      #     the full suite runs ~4h. The release condition's second clause is an owner-verified
      #     green full-suite run over the released commit, recorded in the release evidence
      #     (scripts/run-e2e-full.ps1; parallel failures rerun serially per
      #     docs/e2e-test-lanes.md). No scheduled lane exists yet — until one does, the clause
      #     is satisfied by the recorded manual run, not by CI.
      #   Tempo.ReportServer.Api.Tests.MsSql is IN the gate since Fáze 19: without
      #     REPORTSERVER_TEST_CONNECTION the suite starts its own
      #     mcr.microsoft.com/mssql/server:2022-latest container via Testcontainers
      #     (MsSqlContainerFixture; ubuntu-latest runners carry Docker). Re-adding a
      #     FullyQualifiedName!~ clause for it is a silent hole — ReleaseGateFilterTests names it.
      # Smtp4Dev is NOT an exception: the two Demo.Api tests are in the gate and CI starts
      # smtp4dev as a job service (ports 2525/5000). Keep this filter identical to
      # publish-nuget.yml AND to the second lane below — ReleaseGateFilterTests enforces every
      # occurrence in both files, not just the first one.
      #
      # THE TAG GUARD IN THIS GATE — written here because a green gate is otherwise read as covering
      # everything the suite contains, and because what `fetch-depth: 0` above changed is easy to
      # over- or under-read.
      # `ReleaseContractTests.AnnouncedVersion_IsEitherUntagged_OrItsTagNamesTheCommitBeingPacked`
      # compares the announced version against the tag of that name.
      #   * ON A BRANCH PUSH THE GUARD IS NOW LIVE — it was not while the checkout ran at depth 1.
      #     A shallow fetch carries no tags, so the lookup found nothing and reported "no such tag",
      #     which is that guard's PASSING value: the green was VACUOUS. Measured 2026-08-21 by
      #     running the guard itself over a `git clone --depth 1 --no-tags` of this repository with
      #     the changelog announcing an already-tagged number: RED in a full clone
      #     (`tag-commit=714093ce…`, `visible-tags=77`), GREEN in the CI-shaped one
      #     (`tag-commit=(no such tag)`, `visible-tags=0`). Same binary, same HEAD, same changelog;
      #     the ref store was the only variable. With `fetch-depth: 0` every tag is in the store, so
      #     announcing a number whose tag already names ANOTHER commit — a spent number, e.g. a main
      #     push that still announces the version the last tag shipped — is red HERE now, by design,
      #     and the treatment is a bump, never a retag.
      #   * ON A TAG PUSH THE GUARD IS STILL TAUTOLOGICAL, which no fetch-depth changes: the version
      #     being published is taken FROM the tag (see "Set version"), and the step below refuses a
      #     tag that disagrees with the changelog — so the guard's subject `v<announced>` IS the
      #     pushed tag, which names this very HEAD. Measured in the same clone with `v2.8.20`
      #     created at HEAD and all 78 tags visible: GREEN, with `tag-commit == head`.
      # WHAT CI ALSO COVERS of the same danger, so this is not read as "the tag is the only check":
      # `AnnouncedVersion_OnTheFeed_CarriesWhatThisTreeBuilds` in this step and the refusal in
      # eng/pack-nuget-packages.sh both ask nuget.org whether the number is already SERVED, and
      # neither depends on the ref store at all. Tag, PUT and availability are three different
      # quantities.
      #
      # AND THIS IS THE STEP A RE-RUN OF A SPENT RELEASE DIES IN, which is why the bound about re-runs
      # is repeated here and not left beside the push step alone. The `publish` job carries `needs:
      # build-and-test`, so once the announced number is visible on nuget.org this step goes
      # red and the publish job never starts — the reader who clicked "Re-run jobs" therefore meets
      # THIS failure, not the push step's explanation of it, and not even the refusal in
      # eng/pack-nuget-packages.sh at the `Build packages` step, which is itself ahead of the
      # `Push packages to NuGet.org` step. So, said here: a re-run over a number that already went out is EXPECTEDLY RED
      # and is NOT evidence that the release failed. The number is spent, the artefacts under it are
      # immutable, and THE TREATMENT IS A BUMP, NOT A RE-RUN — no re-run of that run can come back
      # green.
      # THE EXCEPTION IS THE PROPAGATION WINDOW: for roughly the first 431 s after the PUT (measured
      # once, for 2.8.20 — an observation, not a limit; see eng/pack-nuget-packages.sh) neither feed
      # guard can see the number, both pass truthfully, and the push step's own accounting is the only
      # thing that refuses. The two placements cover different moments of the same re-run.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~Tempo.Blazor.E2E"

      # A SECOND LANE OVER THE SAME BINARIES, DIFFERING IN EXACTLY ONE VARIABLE: the ambient culture.
      #
      # THE CLASS OF DEFECT IT EXISTS FOR, measured rather than imagined: a test whose subject is a
      # PAGE spells English chrome ("Copied", "Active", "Folder permissions") only because it had to
      # spell something. Under an English or invariant culture such a test is green while measuring
      # nothing about language; under a Czech one it reads the Czech translation and turns red. Ten
      # of them were found that way on 2026-08-21 (commit a51e833d) — on a developer machine, because
      # no workflow set a locale and .NET then resolves the neutral, English table.
      #
      # MEASURED 2026-08-21 over ONE build of tests/Tempo.ReportServer.Web.Tests, with one pinned test
      # unpinned as the mutation:
      #     LC_ALL=cs_CZ.UTF-8   -> 1 failed / 97 passed  (the mutated test, on its own assertion)
      #     LC_ALL=C.UTF-8       -> 98 passed             (what this runner did before this lane)
      #     no LANG/LC_ALL at all-> 98 passed             (a bare runner's shape)
      # The binaries were identical in all three, so those greens are the blindness itself.
      # The whole gate is green under this lane. THE COUNTS ARE DELIBERATELY NOT WRITTEN HERE: the
      # first version of this comment carried them, and they had already rotted by the end of the
      # round that wrote it — the same round added four guards, so the number it quoted described the
      # previous tree. The lane prints its own totals on every run, which is the only place they can
      # stay true. Cost, measured 2026-08-21 on a developer machine: about a minute of extra test
      # time and no extra build, because this lane reuses the first one's --no-build output.
      #
      # THE LOCALE IS SET ON THIS STEP AND NOWHERE ELSE, and the placement is load-bearing: exporting
      # a locale before `dotnet build` changes the order in which globbed sources are enumerated and
      # therefore the emitted IL. This lane must differ from the first in what the tests READ, never
      # in what was compiled — it reuses the same --no-build output, so it cannot.
      #
      # cs_CZ DOES NOT HAVE TO EXIST IN THE RUNNER'S glibc. Measured on a box whose `locale -a` lists
      # four entries and no fr_FR: LC_ALL=fr_FR.UTF-8 still flipped the culture and turned the mutated
      # test red. .NET reads the variable and resolves through ICU, so this lane is not silently
      # vacuous on a stock image. The echo prints both variables on every run, so a lane that lost
      # them says so instead of passing quietly.
      #
      # WHAT IT DOES NOT COVER: a defect that needs a THIRD culture — Turkish dotted-I casing, say —
      # is invisible to both lanes. This closes "assumes the machine speaks English", not
      # "is culture-sensitive at all".
      - name: Test (non-English ambient culture)
        env:
          LANG: cs_CZ.UTF-8
          LC_ALL: cs_CZ.UTF-8
        run: |
          echo "[locale-lane] LANG=$LANG LC_ALL=$LC_ALL"
          dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~Tempo.Blazor.E2E"

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    # DEC-TEMPO-NUGET-ENVIRONMENT (F4): the job that can push packages runs inside the GitHub
    # Environment `nuget-org`, whose required reviewer is the owner (ptyll) — a tag push or a
    # workflow_dispatch then cannot reach eng/push-nuget-packages.sh without human approval.
    # Until the environment is created in GitHub UI (manual owner task, N206) this line already
    # fails CLOSED: GitHub refuses the job with "Environment not found", it does not publish.
    environment: nuget-org
    # Publikujeme jen na verzovaném tagu (release, refs/tags/v*) nebo při ručním spuštění -
    # NE na každý push do main/master (ten jen builduje a testuje). Verzi řídí tag / csproj.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    permissions:
      id-token: write  # Povinné pro Trusted Publishing (OIDC)
      contents: read

    steps:
      # fetch-depth: 0 — same reason as the build-and-test checkout above: the full ref store is
      # what the suite's git-facing guards are written against, and the pack script stamps each
      # package with `git rev-parse HEAD`.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify NuGet package manifest
        run: bash eng/verify-nuget-package-manifest.sh

      # Načteme základní verzi z csproj a nastavíme finální verzi
      - name: Set version
        id: version
        run: |
          # Načteme verzi z Tempo.Blazor.csproj
          BASE_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Tempo.Blazor/Tempo.Blazor.csproj)
          echo "Base version from csproj: $BASE_VERSION"
          
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            # Z tagu v1.2.3 uděláme verzi 1.2.3
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Using version from tag: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ github.event.inputs.version_suffix }}" ]; then
            # Ruční spuštění bez suffixu = použijeme verzi z csproj
            echo "VERSION=$BASE_VERSION" >> $GITHUB_OUTPUT
            echo "Using release version from csproj: $BASE_VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_suffix }}" ]; then
            # Suffix pro prerelease verze (např. 1.0.0-beta1)
            echo "VERSION=$BASE_VERSION-${{ github.event.inputs.version_suffix }}" >> $GITHUB_OUTPUT
            echo "Using version with suffix: $BASE_VERSION-${{ github.event.inputs.version_suffix }}"
          fi
          # Tato publish úloha běží jen na tagu refs/tags/v* (release) nebo workflow_dispatch
          # (viz job `if:`), takže větev s CI timestampem (main/master push) z build-and-test zde
          # není dosažitelná a záměrně chybí.

      # THE NUMBER BEING PUBLISHED IS COMPARED WITH THE NUMBER BEING ANNOUNCED, and nothing did that
      # before this step existed. On a tag push VERSION comes from the TAG (above), while the two feed
      # guards ask about whichever number they were handed — one about the changelog's, one about
      # $VERSION. The pair csproj ↔ CHANGELOG is clamped by ReleaseContractTests; the pair
      # TAG ↔ CHANGELOG was clamped by nobody, only by a procedure ("tag after the bump"), and a
      # procedure is not a gate. Placed BEFORE Build and Build packages so a disagreeing release is
      # refused before any work, and before any push can be attempted.
      - name: Verify the version being published is the one the changelog announces
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: bash eng/verify-announced-version.sh

      # DEC-TEMPO-RELEASE-GATE, second clause: the release condition is the CI filter AND an
      # owner-verified green full-suite E2E run over this commit (or one differing only in paths
      # that cannot change the outcome — the staleness bound in the script header). The evidence
      # JSON is written by the recorded run (scripts/run-e2e-full.ps1 shape); this refuses a
      # release whose evidence is missing, stale, carries unresolved serial reds, or is
      # internally inconsistent — BEFORE anything is built or pushed.
      - name: Verify the release evidence (DEC-TEMPO-RELEASE-GATE)
        run: bash eng/verify-release-evidence.sh

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Build packages
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: bash eng/pack-nuget-packages.sh

      - name: List packages
        run: ls -la ./packages

      # THE PUSH CLASSIFIER IS BOUND TO SDK WORDING (10.0.111: "Your package was pushed." /
      # "Created http" vs "already exists at feed" / "Conflict http"). A future SDK that rewords
      # those sentences would classify every package UNRESOLVED and fail the release loudly.
      # This probe re-measures the wording against a local 201/409 endpoint over the packages
      # just packed, before anything is sent to the real feed. See eng/verify-push-classifier.sh.
      - name: Probe the push classifier against a local 201/409 endpoint
        run: bash eng/verify-push-classifier.sh

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      # EVERY PACKAGE GETS ITS OWN VERDICT, and the job is green only when all of them were published.
      # `--skip-duplicate` (which the script keeps, and keeps for a reason — see its header) answers a
      # 409 with EXIT 0, so this loop used to report the same green whether 26 packages went out or
      # none did. The script pushes all 26 regardless of what happens to any one of them — dropping
      # the flag would abort the rest and ship half a release — then classifies each as PUBLISHED,
      # SKIPPED, FAILED or UNRESOLVED and fails the job on anything that is not PUBLISHED.
      #
      # AND THERE IS NO GREEN SECOND RUN OF THIS STEP ONCE IT HAS PUSHED. That is the intended
      # semantics of the accounting above, and it is written down here so the next reader does not go
      # hunting for a defect that is not there. The verdict is `published == total`, and a package the
      # feed already serves under this number classifies as SKIPPED rather than PUBLISHED — so a second
      # run over a number that already went out reports every staged package SKIPPED and fails, and it
      # will keep failing that way for as long as that number exists. Re-running this job because the
      # artefact upload died, or because somebody clicked "Re-run jobs", is therefore EXPECTEDLY RED
      # and is NOT evidence that the release failed. THE TREATMENT IS A BUMP, NOT A RE-RUN: the number
      # is spent, the artefacts under it are immutable, and the way forward is the next number on a new
      # run. No re-run of this one can come back green.
      - name: Push packages to NuGet.org
        env:
          PUSH_SOURCE: "https://api.nuget.org/v3/index.json"
          PUSH_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: bash eng/push-nuget-packages.sh

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg
